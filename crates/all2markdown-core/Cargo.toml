[package]
name = "all2markdown-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
unword = "0.2"
docx-rs = "0.4"
rtf-parser = "0.4"
pdf-extract = "0.7"
zip = "2"
thiserror = "2"
encoding_rs = "0.8.40"
chardetng = "0.1"
flate2 = "1.1.10"
ruzstd = "0.9.0"
lzma-rs = "0.3.0"
bzip2-rs = "0.1.2"
quick-xml = "0.42.0"
lopdf = "0.34"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
encoding_rs = "0.8.40"
flate2 = "1.1.10"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
